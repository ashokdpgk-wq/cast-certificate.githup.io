<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aadhaar Card Search System</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef2f7;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#1565c0,#0d47a1);
color:#fff;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.15);
margin-bottom:20px;
}

.header h1{
font-size:30px;
}

.header p{
margin-top:5px;
font-size:15px;
}

.searchBox{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

#searchInput{
width:100%;
padding:15px;
font-size:17px;
border:2px solid #1976d2;
border-radius:10px;
outline:none;
}

.counter{
display:flex;
gap:15px;
margin-top:15px;
}

.counter div{
flex:1;
background:#f7f7f7;
padding:15px;
border-radius:10px;
text-align:center;
font-weight:bold;
}

.counter span{
display:block;
font-size:28px;
margin-top:5px;
color:#1565c0;
}

.buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:20px;
}

.buttons button{
padding:14px;
border:none;
border-radius:10px;
font-size:15px;
font-weight:bold;
cursor:pointer;
color:#fff;
}

#addBtn{background:#16a34a;}
#backupBtn{background:#2563eb;}
#restoreBtn{background:#ea580c;}
#deleteBtn{background:#dc2626;}

.form{
display:none;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

.form input{
width:100%;
padding:14px;
margin-bottom:15px;
border:2px solid #ddd;
border-radius:10px;
font-size:16px;
}

#saveBtn{
width:100%;
padding:15px;
background:#16a34a;
color:#fff;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
}

#result{
display:flex;
flex-direction:column;
gap:15px;
}

.card{
padding:18px;
border-radius:15px;
color:#fff;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.cardRow{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
}

.name{
font-size:20px;
}

.aadhaar{
text-align:right;
line-height:28px;
}

#noRecord{
display:none;
background:#fff;
padding:20px;
border-radius:15px;
text-align:center;
color:red;
font-size:18px;
font-weight:bold;
}

@media(max-width:700px){

.buttons{
grid-template-columns:repeat(2,1fr);
}

.counter{
flex-direction:column;
}

.cardRow{
flex-direction:column;
align-items:flex-start;
}

.aadhaar{
text-align:left;
}

}

.form select{
width:100%;
padding:14px;
margin-bottom:15px;
border:2px solid #ddd;
border-radius:10px;
font-size:16px;
background:#fff;
}

</style></head><body><div class="container"><div class="header">
<h1>AADHAAR CARD SEARCH SYSTEM</h1>
<p>Search • Add • Backup • Restore</p>
</div><div class="searchBox"><input
type="text"
id="searchInput"
placeholder="Search Name or Aadhaar Number">

<div class="counter"><div>
Total Record
<span id="totalCount">0</span>
</div><div>
Search Result
<span id="searchCount">0</span>
</div></div></div><div class="buttons"><button id="addBtn">Add Customer</button>

<button id="backupBtn">Backup</button>

<button id="restoreBtn">Restore</button>

<button id="deleteBtn">Delete All</button>

<input type="file"
id="restoreFile"
accept=".json,.js"
hidden>

</div><div class="form" id="form"><input
type="text"
id="customerName"
placeholder="Customer Name">

<input
type="text"
id="aadhaarInput"
maxlength="12"
placeholder="12 Digit Aadhaar Number">

<select id="relationType">
    <option value="Father">Father</option>
    <option value="Mother">Mother</option>
    <option value="Husband">Husband</option>
    <option value="C/O">C/O</option>
</select><input
type="text"
id="relationName"
placeholder="Relation Name">

<button id="saveBtn">
Save Customer
</button></div><div id="result"></div><div id="noRecord">
No Record Found
</div><script src="aadhaar_backup_gadheyarkuthi.js"></script><script>

let data;

/*
====================================================
NO LOCAL STORAGE
====================================================

Data is loaded only from:
1. window.aadhaarData from the JS backup file
2. Built-in data below

Nothing is read from or written to localStorage.
*/

if (Array.isArray(window.aadhaarData)) {

    data = window.aadhaarData;

} else {

    data = [

        {
            "name": "JYOTSNA ROY",
            "relationType": "Husband",
            "relationName": "DHIRENDRA NATH ROY",
            "raw": "203916859604",
            "format": "2039-1685-9604"
        },

        {
            "name": "DEBBRATA ROY",
            "relationType": "Father",
            "relationName": "DHIRENDRA NATH ROY",
            "raw": "848772006383",
            "format": "8487-7200-6383"
        }

    ];

}

const searchInput=document.getElementById("searchInput");
const result=document.getElementById("result");
const totalCount=document.getElementById("totalCount");
const searchCount=document.getElementById("searchCount");
const noRecord=document.getElementById("noRecord");

const form=document.getElementById("form");
const addBtn=document.getElementById("addBtn");

addBtn.onclick=function(){

form.style.display=
form.style.display=="block"?
"none":"block";

};

function updateTotal(){

totalCount.innerHTML=data.length;

}

updateTotal();

function formatAadhaar(num){

return num.replace(
/(\d{4})(\d{4})(\d{4})/,
"$1-$2-$3"
);

}

function rainbow(index){

let hue=(index*137.5)%360;

return `linear-gradient(
135deg,
hsl(${hue},85%,65%),
hsl(${(hue+40)%360},85%,50%)
)`;

}

function showData(list){

result.innerHTML="";

if(list.length==0){

searchCount.innerHTML=0;
noRecord.style.display="block";
return;

}

noRecord.style.display="none";
searchCount.innerHTML=list.length;

list.forEach((item,index)=>{

result.innerHTML+=`

<div class="card"
style="background:${rainbow(index)}">

<div class="cardRow">

<div class="name">
${item.name}
<br>
<small>${item.relationType} : ${item.relationName}</small>
</div>

<div class="aadhaar">

${item.raw}

<br>

${item.format}

</div>

</div>

</div>

`;

});

}

/* SEARCH */

searchInput.addEventListener("input",function(){

const text=this.value.trim().toLowerCase();

result.innerHTML="";

if(text==""){

searchCount.innerHTML=0;
noRecord.style.display="none";

return;

}

const onlyNumber=text.replace(/\D/g,"");

const filter=data.filter(item=>{

if(onlyNumber.length>0){

return item.raw.includes(onlyNumber)
||

item.format.replace(/\D/g,"")
.includes(onlyNumber);

}

return item.name
.toLowerCase()
.startsWith(text);

});

showData(filter);

});

const customerName = document.getElementById("customerName");
const aadhaarInput = document.getElementById("aadhaarInput");
const relationType = document.getElementById("relationType");
const relationName = document.getElementById("relationName");
const saveBtn = document.getElementById("saveBtn");

/* Add Customer */

saveBtn.addEventListener("click", function(){

    let name = customerName.value.trim();
    let raw = aadhaarInput.value.replace(/\D/g,"");

    if(name==="" || raw===""){
        alert("Please fill all fields.");
        return;
    }

    if(raw.length!==12){
        alert("Aadhaar Number must be 12 digits.");
        return;
    }

    // Duplicate Check
    if(data.some(item => item.raw === raw)){
        alert("This Aadhaar Number already exists.");
        return;
    }

    data.push({
        name:name,
        relationType:relationType.value,
        relationName:relationName.value.trim(),
        raw:raw,
        format:formatAadhaar(raw)
    });

    /*
    NO localStorage save here.
    Data exists only in memory.
    */

    updateTotal();

    customerName.value="";
    aadhaarInput.value="";
    relationName.value="";
    form.style.display="none";

    alert("Customer Added Successfully");

});

/* ===== Backup Download ===== */

const backupBtn = document.getElementById("backupBtn");

backupBtn.addEventListener("click", function(){

    if(data.length === 0){
        alert("No customer data found.");
        return;
    }

    const jsData = `window.aadhaarData = ${JSON.stringify(data, null, 2)};\n`;

    const blob = new Blob([jsData], {
        type: "application/javascript"
    });

    const url = window.URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "aadhaar_backup.js";

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    window.URL.revokeObjectURL(url);

});

/* ===== Restore Backup ===== */

const restoreBtn = document.getElementById("restoreBtn");
const restoreFile = document.getElementById("restoreFile");

restoreBtn.addEventListener("click", function () {
    restoreFile.value = "";
    restoreFile.click();
});

restoreFile.addEventListener("change", function (e) {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function () {

        try {

            let backupData;
            const text = reader.result.trim();

            if (file.name.toLowerCase().endsWith(".js")) {

                const match = text.match(
                    /(?:window\.)?aadhaarData\s*=\s*([\s\S]*?)\s*;?\s*$/
                );

                if (!match) throw new Error("Invalid JS backup");

                backupData = JSON.parse(
                    match[1].replace(/;\s*$/, "")
                );

            } else {

                backupData = JSON.parse(text);

            }

            if (!Array.isArray(backupData)) {
                alert("Invalid Backup File");
                return;
            }

            /*
            Restore only into RAM.
            Nothing is saved to localStorage.
            */

            data = backupData;

            updateTotal();

            searchInput.value = "";
            result.innerHTML = "";
            searchCount.textContent = "0";
            noRecord.style.display = "none";

            alert("Backup Restore Successfully");

        } catch (err) {

            alert("Invalid JSON or JS Backup File");

        }

    };

    reader.readAsText(file);

});

/* ===== Delete All ===== */

const deleteBtn = document.getElementById("deleteBtn");

deleteBtn.addEventListener("click", function () {

    if (!confirm("Are you sure you want to delete all customers?")) {
        return;
    }

    // Empty Array
    data.length = 0;

    /*
    No localStorage operation.
    */

    result.innerHTML = "";
    searchInput.value = "";
    searchCount.textContent = "0";
    totalCount.textContent = "0";
    noRecord.style.display = "none";

    alert("All Customer Deleted Successfully");

});

</script></body>
</html>
