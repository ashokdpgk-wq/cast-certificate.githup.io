<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#172033;font-family:Arial,"Noto Sans Bengali",sans-serif}
.header{background:linear-gradient(135deg,#073b2b,#0a7a48);color:#fff;padding:25px 14px;text-align:center}
.header h1{margin:0;font-size:25px}.header p{margin:7px 0 0;font-size:13px;opacity:.9}
.container{max-width:1380px;margin:auto;padding:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;padding:14px 17px;box-shadow:0 2px 9px #0001}.stat small{color:#64748b}.stat b{display:block;color:#087443;font-size:22px;margin-top:4px}
.searchbox{background:#fff;border-radius:14px;padding:15px;box-shadow:0 2px 9px #0001;margin-bottom:13px}
.searchrow{display:flex;gap:9px}.searchrow input{flex:1;padding:14px;border:2px solid #d5dee7;border-radius:10px;font-size:16px;outline:0}.searchrow input:focus{border-color:#087443}
.clear{border:0;border-radius:10px;padding:0 20px;background:#e8edf2;color:#334155;font-weight:bold}
.quick{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.quick button{border:1px solid #cbe5d7;background:#f1fbf6;color:#087443;border-radius:7px;padding:6px 10px;cursor:pointer}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:12px 2px;color:#475569;font-size:13px}
.tablebox{background:#fff;border-radius:14px;overflow:auto;box-shadow:0 2px 9px #0001}
table{width:100%;min-width:1080px;border-collapse:collapse}thead{background:#073b2b;color:#fff}th{padding:12px 9px;text-align:left;font-size:12px;white-space:nowrap}
td{padding:11px 9px;border-bottom:1px solid #e8edf1;font-size:12.5px;vertical-align:top}tbody tr:hover td{background:#f4faf7}
.num{text-align:center;color:#64748b}.name{font-weight:bold;color:#087443}.mono{font-family:monospace;font-size:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eaf7f0;color:#087443;font-size:11px;font-weight:bold}
.red{background:#fff0f0;color:#b42318}
.mobile{display:none}.card{background:#fff;border-left:4px solid #087443;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px #0001}
.cardtop{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}.card h3{margin:0;color:#087443;font-size:17px}
.line{display:flex;border-top:1px solid #edf1f4;padding:8px 0}.line span{width:112px;flex-shrink:0;color:#64748b;font-size:11px}.line b{font-size:12.5px;word-break:break-word}
.pages{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;padding:15px}.pages button{background:#fff;border:1px solid #ccd5dd;border-radius:7px;padding:8px 11px;cursor:pointer}.pages .active{background:#087443;color:#fff;border-color:#087443}
.empty{background:#fff;border-radius:14px;padding:50px;text-align:center;color:#64748b}
@media(max-width:700px){.header h1{font-size:20px}.container{padding:9px}.stats{grid-template-columns:repeat(2,1fr);gap:7px}.stat{padding:10px}.stat b{font-size:18px}.searchrow{flex-direction:column}.clear{height:43px}.tablebox{display:none}.mobile{display:block}.toolbar{font-size:12px}}
</style>
</head>

function score(r,q){let s=0;if(norm(r.applicantName).startsWith(q))s+=100;if(norm(r.applicationNo).startsWith(q))s+=95;if(norm(r.village).startsWith(q))s+=80;if(norm(r.scheme).startsWith(q))s+=70;Object.values(r).forEach(v=>{let x=norm(v);if(x===q)s+=50;else if(x.startsWith(q))s+=25;else if(x.includes(q))s+=6});return s}

function clearSearch(){document.getElementById("q").value="";list=DATA.slice();page=1;render()}
function render(){

let p="";if(max>1){p+=`<button onclick="go(${Math.max(1,page-1)})">‹ Prev</button>`;let a=Math.max(1,page-2),b=Math.min(max,page+2);if(a>1)p+=`<button onclick="go(1)">1</button>`;if(a>2)p+="...";for(let x=a;x<=b;x++)p+=`<button class="${x===page?"active":""}" onclick="go(${x})">${x}</button>`;if(b<max-1)p+="...";if(b<max)p+=`<button onclick="go(${max})">${max}</button>`;p+=`<button onclick="go(${Math.min(max,page+1)})">Next ›</button>`}document.getElementById("pages").innerHTML=p}
function go(x){page=x;render();scrollTo({top:0,behavior:"smooth"})}
